<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAx | Gaming & Social Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #8b5cf6; --secondary: #06b6d4; --dark: #0f172a; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: #fff; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-btn { background: linear-gradient(45deg, var(--primary), var(--secondary)); transition: 0.3s; }
        .neon-btn:hover { box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); transform: translateY(-2px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <div id="loader" class="fixed inset-0 z-[300] bg-slate-950 flex items-center justify-center transition-opacity duration-500">
        <h1 class="orbitron text-4xl font-black text-purple-500 animate-pulse">NOVA<span class="text-white text-2xl">x</span></h1>
    </div>

    <div id="auth-modal" class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-md flex items-center justify-center p-4 hidden">
        <div class="glass w-full max-w-md p-8 rounded-3xl relative">
            <button onclick="toggleAuthModal(false)" class="absolute top-4 right-4 text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            
            <div id="auth-step-1">
                <h2 class="orbitron text-2xl font-bold text-center text-purple-500 mb-6">WELCOME TO NOVAx</h2>
                
                <div class="space-y-4">
                    <button id="google-login" class="w-full bg-white text-black py-3 rounded-xl font-bold flex items-center justify-center gap-3">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18"> الدخول عبر جوجل
                    </button>

                    <div class="relative py-2"><hr class="border-white/10"><span class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 px-2 text-xs text-gray-500">أو يدوي</span></div>

                    <input type="text" id="reg-name" placeholder="اسم المستخدم" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl outline-none focus:border-purple-500">
                    <input type="text" id="reg-id" placeholder="الجيميل أو رقم الهاتف (+20)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl outline-none focus:border-purple-500">
                    <input type="password" id="reg-p1" placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl outline-none focus:border-purple-500">
                    
                    <div id="recaptcha-container"></div> <button id="main-auth-btn" class="neon-btn w-full py-4 rounded-xl font-black">متابعة</button>
                </div>
            </div>

            <div id="auth-otp" class="hidden text-center">
                <h2 class="text-xl font-bold mb-4">أدخل كود التحقق</h2>
                <p class="text-gray-400 text-sm mb-6">لقد أرسلنا كوداً مكوناً من 6 أرقام</p>
                <input type="text" id="otp-input" placeholder="0 0 0 0 0 0" class="w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-center text-2xl tracking-widest outline-none">
                <button id="verify-otp-btn" class="neon-btn w-full py-4 rounded-xl font-black mt-6">تأكيد الرمز</button>
            </div>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-50 glass border-b border-white/5">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="orbitron text-2xl font-black cursor-pointer" onclick="showTab('home')">NOVA<span class="text-purple-500">x</span></h1>
            <div class="flex items-center gap-4">
                <div class="glass px-4 py-1.5 rounded-full text-cyan-400 font-bold" id="user-balance">0.00 EGP</div>
                <button onclick="showTab('dashboard')" class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center"><i class="fa-solid fa-user"></i></button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 pt-28 pb-12">
        <section id="home" class="tab-content active text-center">
            <h2 class="text-5xl font-black mb-8 leading-tight">شحن الألعاب <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-cyan-400">بلمسة واحدة</span></h2>
            <button onclick="showTab('services')" class="neon-btn px-12 py-4 rounded-full font-bold text-lg">تصفح الخدمات</button>
        </section>

        <section id="services" class="tab-content">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="services-grid">
                <div onclick="checkAndOrder('PUBG')" class="glass p-6 rounded-3xl cursor-pointer hover:border-purple-500 transition">
                    <img src="https://files.freemyfire.com/posts/pubg-mobile.jpg" class="w-full h-40 object-cover rounded-2xl mb-4">
                    <h3 class="text-xl font-bold">ببجي موبايل (UC)</h3>
                    <p class="text-gray-500 text-sm">شحن فوري عبر الـ ID</p>
                </div>
            </div>
        </section>

        <section id="dashboard" class="tab-content">
            <div class="glass p-8 rounded-3xl max-w-lg mx-auto">
                <h3 class="text-2xl font-black mb-2" id="profile-name">مستخدم</h3>
                <p class="text-gray-500 mb-6" id="profile-email">---</p>
                <button id="logout-btn" class="text-red-500 font-bold hover:underline">تسجيل الخروج</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyCsZBSHCRHir1Qxk5opZLZsfazCL7IOAcc",
            authDomain: "novax-4249e.firebaseapp.com",
            projectId: "novax-4249e",
            storageBucket: "novax-4249e.firebasestorage.app",
            messagingSenderId: "705521379752",
            appId: "1:705521379752:web:10800a86fa18a8b1eb959d",
            measurementId: "G-VSXCYH6WQJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let confirmationResult = null;

        // --- Auth Functions ---
        window.toggleAuthModal = (show) => {
            document.getElementById('auth-modal').classList.toggle('hidden', !show);
        };

        window.showTab = (tabId) => {
            if(['dashboard'].includes(tabId) && !auth.currentUser) {
                return toggleAuthModal(true);
            }
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        };

        // 1. Google Login
        document.getElementById('google-login').onclick = async () => {
            const provider = new GoogleAuthProvider();
            try {
                const res = await signInWithPopup(auth, provider);
                await syncUser(res.user);
                toggleAuthModal(false);
            } catch (e) { alert(e.message); }
        };

        // 2. Register / Login Handler
        document.getElementById('main-auth-btn').onclick = async () => {
            const id = document.getElementById('reg-id').value;
            const pass = document.getElementById('reg-p1').value;
            const name = document.getElementById('reg-name').value;

            if(id.includes('@')) { // Email Auth
                try {
                    const res = await createUserWithEmailAndPassword(auth, id, pass);
                    await syncUser(res.user, name);
                    toggleAuthModal(false);
                } catch {
                    await signInWithEmailAndPassword(auth, id, pass);
                    toggleAuthModal(false);
                }
            } else if (id.startsWith('+')) { // Phone Auth (OTP)
                const verifier = new RecaptchaVerifier(auth, 'recaptcha-container', {});
                confirmationResult = await signInWithPhoneNumber(auth, id, verifier);
                document.getElementById('auth-step-1').classList.add('hidden');
                document.getElementById('auth-otp').classList.remove('hidden');
            } else {
                alert("يرجى إدخال إيميل صحيح أو رقم هاتف يبدأ بـ +20");
            }
        };

        // 3. Verify OTP
        document.getElementById('verify-otp-btn').onclick = async () => {
            const code = document.getElementById('otp-input').value;
            try {
                const res = await confirmationResult.confirm(code);
                await syncUser(res.user, document.getElementById('reg-name').value);
                location.reload();
            } catch (e) { alert("الكود خاطئ"); }
        };

        async function syncUser(user, customName = "") {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if(!snap.exists()) {
                await setDoc(userRef, {
                    name: customName || user.displayName || "مستخدم جديد",
                    email: user.email || user.phoneNumber,
                    balance: 0,
                    role: 'user'
                });
            }
        }

        // --- State Listener ---
        onAuthStateChanged(auth, (user) => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (d) => {
                    if(d.exists()) {
                        document.getElementById('user-balance').innerText = d.data().balance.toFixed(2) + " EGP";
                        document.getElementById('profile-name').innerText = d.data().name;
                        document.getElementById('profile-email').innerText = d.data().email;
                    }
                });
            }
        });

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
    </script>
</body>
</html>
